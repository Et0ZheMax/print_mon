[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prn-site-ping"
version = "0.4.1"
description = "Tiny Tkinter dashboard: ping printers by name and open their web UI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Recovered/maintained by you"}]
keywords = ["printers", "tkinter", "ping", "dashboard"]

# Runtime SNMP client.
dependencies = ["pysnmp>=7.1,<8"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prn-site-ping = "prn_site_ping.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
prn_site_ping = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
